# Merge only updates allowed by .github/auto-merge.yml after testing the PR commit.
name: Auto-Merge Dependabot PRs

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # The PR runs without repository secrets, saved credentials, or shared caches.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev
      - run: docker build --file dockerfile --tag pixelit-api:test .
      - name: Smoke-test production image
        run: >-
          docker run --rm --network none
          --mount "type=bind,src=${PWD}/scripts/container-smoke.js,dst=/tmp/container-smoke.js,readonly"
          pixelit-api:test node /tmp/container-smoke.js

  auto-merge:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted merge policy
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verify the tested commit is still current
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha) {
              core.setFailed('The PR changed after testing; wait for tests on the new commit.');
            }

      - name: Merge eligible dependency updates
        uses: ahmadnassri/action-dependabot-auto-merge@v2
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          command: squash and merge
